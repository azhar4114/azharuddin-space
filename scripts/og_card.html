<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OG Card</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1200px;
      height: 630px;
      background-color: #10141D;
      color: #F4F7FC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 70px 80px;
      position: relative;
      overflow: hidden;
    }
    .grid-bg {
      position: absolute;
      inset: 0;
      background-image: linear-gradient(to right, rgba(255,255,255,0.03) 1px, transparent 1px),
                        linear-gradient(to bottom, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }
    .glow {
      position: absolute;
      top: -100px;
      right: -100px;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(117, 184, 255, 0.12) 0%, transparent 70%);
      pointer-events: none;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 16px;
      position: relative;
      z-index: 10;
    }
    .monogram {
      width: 48px;
      height: 48px;
      background: #75B8FF;
      color: #10141D;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 24px;
    }
    .domain {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 20px;
      color: #8C99AE;
      font-weight: 500;
    }
    .main {
      position: relative;
      z-index: 10;
      margin-top: auto;
      margin-bottom: auto;
    }
    .eyebrow {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: #75B8FF;
      margin-bottom: 16px;
      font-weight: 600;
    }
    .name {
      font-size: 58px;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.1;
      margin-bottom: 16px;
      color: #F4F7FC;
    }
    .role {
      font-size: 24px;
      color: #8C99AE;
      line-height: 1.4;
      max-width: 900px;
      font-weight: 400;
    }
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      z-index: 10;
      border-top: 1px solid #20293A;
      padding-top: 24px;
    }
    .tags {
      display: flex;
      gap: 12px;
    }
    .tag {
      background: #171E2B;
      border: 1px solid #20293A;
      padding: 6px 14px;
      border-radius: 6px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
      color: #8C99AE;
    }
    .tag-accent {
      border-color: rgba(117, 184, 255, 0.4);
      color: #75B8FF;
    }
  </style>
</head>
<body>
  <div class="grid-bg"></div>
  <div class="glow"></div>

  <div class="header">
    <div class="monogram">A.</div>
    <span class="domain">azharuddin.space</span>
  </div>

  <div class="main">
    <div class="eyebrow">Enterprise Engineering &amp; Observability</div>
    <h1 class="name">Mohammad Azharuddin</h1>
    <p class="role">Lead Integration Architect &amp; Pega Senior System Architect (CSSA)<br/>Python Microservices, Splunk Observability &amp; Developer Tooling</p>
  </div>

  <div class="footer">
    <div class="tags">
      <span class="tag tag-accent">Pega CSSA 23</span>
      <span class="tag">Splunk Enterprise</span>
      <span class="tag">Python Backend</span>
      <span class="tag">Since Dec 2012</span>
    </div>
    <div class="domain" style="font-size: 15px;">Hyderabad, India</div>
  </div>
</body>
</html>
